<!DOCTYPE html>

<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <!--
             <meta charset> Define o conjunto de caracteres (enconding) 
             da página. UTF-8 garante que acentos e caracteres especiais
             apareçam corretamente.
        -->
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        
        <!--
        <meta viewport>:  esta tag é imortante para sites que devem funcionar
        em dispositivos móveis (celular). width-device -> garate que a
        largura da página vai ser adaptar à largura do dispositivo.
        initial-scale=1 -> não aplica zoom automático ao abrir a página. 
        Sem ela o celular vai tentar mostrar a página como se fosse um computador
        -->
        <title>Jogo da Cobrinha</title>

        <!--
        Estilos e CSS - tema de floresta
        -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">

        <style>

            :root {
                --musgo-escuro: #1B4332;
                --musgo: #2D6A4F;
                --folha: #52B788;
                --folha-clara: #95D5B2;
                --tronco: #6B4423;
                --tronco-claro: #8B5A2B;
                --clareira: #F1F7ED;
                --sol: #F4A300;
                --sol-claro: #FFD166;
                --texto-claro: #F1F7ED;
            }

            * {
                box-sizing: border-box;
            }

            body {
                margin: 0;
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 30px 16px;
                font-family: 'Quicksand', sans-serif;
                background:
                    radial-gradient(circle at 20% 15%, rgba(255, 214, 102, 0.25), transparent 45%),
                    linear-gradient(180deg, #0F2A1E 0%, #163C29 35%, #1B4332 100%);
                position: relative;
                overflow-x: hidden;
            }

            /* silhuetas de árvores decorando o fundo, feitas só em CSS */
            body::before,
            body::after {
                content: "";
                position: fixed;
                bottom: 0;
                width: 100%;
                height: 220px;
                background-repeat: repeat-x;
                background-position: bottom;
                pointer-events: none;
                opacity: 0.6;
                z-index: 0;
            }

            body::before {
                background-image:
                    radial-gradient(ellipse 70px 140px at 10% 100%, #0F2A1E 60%, transparent 62%),
                    radial-gradient(ellipse 90px 170px at 30% 100%, #0F2A1E 60%, transparent 62%),
                    radial-gradient(ellipse 70px 130px at 55% 100%, #0F2A1E 60%, transparent 62%),
                    radial-gradient(ellipse 90px 180px at 80% 100%, #0F2A1E 60%, transparent 62%),
                    radial-gradient(ellipse 70px 140px at 100% 100%, #0F2A1E 60%, transparent 62%);
            }

            body::after {
                height: 150px;
                opacity: 0.85;
                background-image:
                    radial-gradient(ellipse 60px 110px at 0% 100%, #163C29 60%, transparent 62%),
                    radial-gradient(ellipse 80px 130px at 22% 100%, #163C29 60%, transparent 62%),
                    radial-gradient(ellipse 60px 100px at 45% 100%, #163C29 60%, transparent 62%),
                    radial-gradient(ellipse 90px 140px at 68% 100%, #163C29 60%, transparent 62%),
                    radial-gradient(ellipse 70px 120px at 90% 100%, #163C29 60%, transparent 62%);
            }

            h1 {
                font-family: 'Baloo 2', sans-serif;
                font-weight: 800;
                color: var(--texto-claro);
                font-size: 2.2em;
                margin: 0 0 18px 0;
                text-shadow: 0 3px 0 rgba(0,0,0,0.25);
            }

            .container {
              position: relative;
              z-index: 1;
              text-align: center;  
              background: linear-gradient(180deg, #FBF3E1 0%, #F1E4C7 100%);
              padding: 28px 30px 22px;
              border-radius: 26px;
              border: 6px solid var(--tronco-claro);
              box-shadow:
                0 18px 40px rgba(0, 0, 0, 0.45),
                inset 0 0 0 3px rgba(107, 68, 35, 0.25);
              max-width: 460px;
            }

            /* pequenas folhas nos cantos do painel, para lembrar uma moldura de trepadeira */
            .container::before,
            .container::after {
                content: "🌿";
                position: absolute;
                font-size: 28px;
                filter: drop-shadow(0 2px 2px rgba(0,0,0,0.25));
            }
            .container::before {
                top: -16px;
                left: -14px;
                transform: rotate(-25deg);
            }
            .container::after {
                bottom: -16px;
                right: -14px;
                transform: rotate(155deg);
            }

            .info {
                font-size: 1.05em;
                display: flex;
                justify-content: center;
                gap: 24px;
                flex-wrap: wrap;
                font-weight: 600;
            }

            .pontuacao {
                color: var(--musgo);
            }

            .pontuacao span, .recorde span {
                font-family: 'Baloo 2', sans-serif;
                color: var(--sol);
                -webkit-text-stroke: 0.6px #7a4d00;
            }

            .recorde {
                color: var(--tronco);
            }

            #canvas{
                border: 4px solid var(--tronco-claro);
                border-radius:  14px;
                background-color: #EAF3E1;
                display: block;

                margin: 18px auto;
                box-shadow:
                    inset 0 0 0 2px rgba(255,255,255,0.5),
                    0 8px 18px rgba(27, 67, 50, 0.35);
            }

            .controles {
                margin-top: 8px;
            }

            button {
                font-family: 'Baloo 2', sans-serif;
                font-size: 16px;
                font-weight: 700;
                cursor: pointer;
                background: linear-gradient(180deg, var(--folha) 0%, var(--musgo) 100%);

                padding: 12px 24px;
                color: #FFFFFF;
                border: none;
                border-bottom: 4px solid #1e4a34;
                border-radius: 12px;
                margin: 5px;
                transition: transform 0.15s ease, filter 0.15s ease;
            }

            button:hover {
                filter: brightness(1.08);
                transform: translateY(-1px);
            }

            button:active {
                transform: translateY(2px);
                border-bottom-width: 2px;
            }

            .teclas{
                display: grid;
                grid-template-columns: repeat(3, 52px);
                gap: 6px;
                justify-content: center;
                margin: 16px auto 4px;
            }

            .tecla{
                width: 52px;
                height: 52px;
                background: linear-gradient(180deg, var(--tronco-claro) 0%, var(--tronco) 100%);
                color: var(--clareira);
                border: none;
                border-bottom: 4px solid #40260f;
                cursor: pointer;
                border-radius: 14px;
                font-size: 20px;
                display: flex;
                align-items: center;
                justify-content: center;
                font-weight: bold;
                transition: transform 0.15s ease;
            }

            .tecla:active{
                background: #40260f;
                transform: translateY(2px);
                border-bottom-width: 2px;
            }

            .tecla.vazio{
                background: transparent;
                border: none;
                cursor: default;
            }

            .instrucoes {
                margin-top: 18px;
                padding: 14px 16px;
                background: rgba(82, 183, 136, 0.15);
                border: 2px dashed var(--folha);
                border-radius: 14px;
                font-size: 14px;
                color: #2C6E49;
                text-align: left;
            }

            .instrucoes h3 {
                margin: 0 0 8px 0;
                color: var(--musgo-escuro);
                font-family: 'Baloo 2', sans-serif;
            }

            .instrucoes p {
                margin: 4px 0;
            }

            /*   
            MEDIA QUERY - adaptação para celular
            É como definir renders diferentes para exibição em cinena (4K) vs 
            Celular na vertical
            */
            @media (max-width: 600px){
                h1 {
                    font-size: 1.6em;
                }
                .info {
                    font-size: 0.95em;
                    gap: 14px;
                }
                .container {
                    padding: 22px 16px 18px;
                }
            }

        </style>
    </head>
    <body>

        <div  class="container">
            <h1>&#128013;  Jogo da Cobrinha &#128517;</h1>

            <div class="info">

                <div class="pontuacao">
                    Pontuação: <span id="pontos"> </span>
                </div>

                <div class="recorde">
                    Recorde: <span id="recorde"> </span>
                </div>

            </div>
            <canvas id="canvas" width="400" height="400">
                <!--
                
                <canvas>: é um elemento especial para desenho 2D ou 3D. Por si só,
                é apenas um retângulo vazio. O JavaScript vai usar o "contexto 2D" 
                para desenhar a cobra, e comida, etc
                -->

            </canvas>

            <div  class="controles">
                
                <button onclick="iniciarJogo()">Iniciar Jogo</button>
                <button onclick="pausarJogo()">Pausar / Continuar</button>

            </div>

            <div class="teclas">

                <div class="tecla vazio"></div>
                <div class="tecla" onclick="mudarDirecao('cima')" >&#9650;</div>
                <div class="tecla vazio"></div>
                <div class="tecla" onclick="mudarDirecao('esquerda')" >&#9668;</div>
                <div class="tecla" onclick="mudarDirecao('baixo')" >&#9660;</div>
                <div class="tecla" onclick="mudarDirecao('direita')" >&#9658;</div>

            </div>

            <div class="instrucoes">
                <h3>Como Jogar:</h3>
                <p>Use as setas de teclado ou os botões acima para controlar a cobra</p>
                <p>Coma as maçãs vermelhas &#127822; para crescer e ganhar pontos</p>
                <p>Não bata nas paredes nem no próprio corpo</p>
            </div>

        </div>

        <script>

            //=============================
            // CONFIGURAÇÕES DO JOGO
            //=============================
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');
            // tamanho de cada quadrado no jogo
            const tamanhoQuadrado = 20;
            // quantos quadrados cabem na largura e altura do espaço 2D
            const quantidadeQuadrados = canvas.width / tamanhoQuadrado;

            //============================
            // Variáveis do Jogo
            //============================
            let cobra;              // Array (vetor) que guarda as posições da cobra
            let direcao;            // Direção atual da cobra
            let proximaDirecao;     // Próxima direção (evita viradas impossíveis)
            let comida;             // Posição da comida
            let pontos;             // Pontuação atual
            let recorde;            // Melhor pontuação
            let jogoAtivo;          // Se o jogo está rodando
            let jogoPausado;        // Se o jogo está pausado
            let intervaloJogo;      // Controla a velocidade do jogo

            //==============================
            // Carregar recorde do Navegador
            //==============================
            recorde = localStorage.getItem('recordeCobrinha') || 0;
            document.getElementById('recorde').textContent = recorde;

            //==============================
            // Função para inicar o Jogo
            //==============================
            function iniciarJogo(){
                cobra = [
                    { x: 10, y: 10},
                    { x: 9,  y: 10},
                    { x: 8,  y: 10},
                ];

                direcao = 'direita';
                proximaDirecao = 'direita';
                pontos = 0;
                jogoAtivo = true;
                jogoPausado = false;

                document.getElementById('pontos').textContent = pontos;

                gerarComida();

                //Limpar o intervalo anterior se existir
                if(intervaloJogo){
                    clearInterval(intervaloJogo);
                }

                //executa a função atualizarJogo a cada 100 milisegundos
                intervaloJogo = setInterval(atualizarJogo, 200);
            }


            //===================================
            // FUNÇÃO PRINCIPAL DO JOGO ( LOOP )
            //===================================
            function atualizarJogo(){
               if(!jogoAtivo || jogoPausado){
                    return;
               }

               direcao = proximaDirecao;
                
               let cabeca = {...cobra[0]} 

               //Mover a cabeça na direção atual
               switch(direcao){
                    case 'cima':
                        cabeca.y--;
                        break;
                    
                    case 'baixo':
                        cabeca.y++;
                        break;

                    case 'esquerda':
                        cabeca.x--;
                        break;

                    case 'direita':
                        cabeca.x++;
                        break;
               }

                // verificar colisão com paredes (esquerda ou direita)
                if(cabeca.x < 0 || cabeca.x >= quantidadeQuadrados){
                   fimDeJogo();
                   return;
               }

                if(cabeca.y < 0 || cabeca.y >= quantidadeQuadrados){
                   fimDeJogo();
                   return;
               }

               // adiciona nova cabeça
               cobra.unshift(cabeca);

               //remover o último elemento do vetor
               cobra.pop();
               
               desenhar();                
            }

               //FIM DE JOGO

               function fimDeJogo(){
                jogoAtivo = false;
                clearInterval(intervaloJogo);


                ctx.fillStyle = 'rgba(15, 42, 30, 0.75)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = '#FFD166';
                ctx.font = 'bold 40px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('PERDEU FIOTE', canvas.width / 2, canvas.height / 2)

                ctx.fillStyle = '#F1F7ED';
                ctx.font = '20px Arial';
                ctx.fillText(`pontuação: ${pontos}`, canvas.width / 2, (canvas.height / 2 + 50));

               }

            //=============================
            //FUNÇÃO PARA DESENHAR OS ELEMENTOS VISUAIS DO JOGO
            //=============================
            function desenhar(){
                // PASSO 1
                //Limpar o fundo do Canvas (tom de clareira / grama clara)
                ctx.fillStyle = '#EAF3E1';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // PASSO 2
                // Desenhar a grade (linhas de referência)
                ctx.strokeStyle = '#D3E4C4';
                ctx.lineWidth = 0.5;

                for(let i = 0; i <= quantidadeQuadrados; i++){
                        //Linha vertical
                        ctx.beginPath();
                        ctx.moveTo(i * tamanhoQuadrado, 0);
                        ctx.lineTo(i * tamanhoQuadrado, canvas.height);
                        ctx.stroke();

                        //Linha horizontal
                        ctx.beginPath();
                        ctx.moveTo(0, i * tamanhoQuadrado);
                        ctx.lineTo(canvas.width, i * tamanhoQuadrado);
                        ctx.stroke();
                } 

                // ----- PASSO 3: Desenhar a cobra ---------------------
                // percorremos do rabo para a cabeça para as escamas
                // ficarem sobrepostas de forma natural
                for(let indice = cobra.length - 1; indice >= 0; indice--){
                    let pedaco = cobra[indice];
                    let cx = pedaco.x * tamanhoQuadrado + tamanhoQuadrado / 2;
                    let cy = pedaco.y * tamanhoQuadrado + tamanhoQuadrado / 2;

                    if(indice === 0){
                        desenharCabeca(cx, cy);
                    } else {
                        desenharCorpo(pedaco, cx, cy, indice);
                    }
                }

               //----  PASSO 4 - Desenhar a comida (maçã) ----------
               desenharMaca();
            }

            //=============================
            // Desenha um retângulo com cantos arredondados
            // (evita depender do ctx.roundRect nativo)
            //=============================
            function retanguloArredondado(x, y, largura, altura, raio){
                ctx.beginPath();
                ctx.moveTo(x + raio, y);
                ctx.arcTo(x + largura, y, x + largura, y + altura, raio);
                ctx.arcTo(x + largura, y + altura, x, y + altura, raio);
                ctx.arcTo(x, y + altura, x, y, raio);
                ctx.arcTo(x, y, x + largura, y, raio);
                ctx.closePath();
            }

            //=============================
            // Desenha um segmento do corpo da cobra, com sombreado
            // e uma "escama" para dar textura
            //=============================
            function desenharCorpo(pedaco, cx, cy, indice){
                let x = pedaco.x * tamanhoQuadrado + 1;
                let y = pedaco.y * tamanhoQuadrado + 1;
                let tamanho = tamanhoQuadrado - 2;

                let corClara = (indice % 2 === 0) ? '#79D070' : '#5EB855';
                let corEscura = (indice % 2 === 0) ? '#4C9A45' : '#3B7D35';

                let gradiente = ctx.createRadialGradient(cx - 3, cy - 3, 1, cx, cy, tamanhoQuadrado / 2);
                gradiente.addColorStop(0, corClara);
                gradiente.addColorStop(1, corEscura);

                ctx.fillStyle = gradiente;
                retanguloArredondado(x, y, tamanho, tamanho, 6);
                ctx.fill();

                //escama (pequeno brilho oval)
                ctx.fillStyle = 'rgba(255, 255, 255, 0.25)';
                ctx.beginPath();
                ctx.ellipse(cx - 2, cy - 2, tamanhoQuadrado / 6, tamanhoQuadrado / 8, Math.PI / 4, 0, Math.PI * 2);
                ctx.fill();
            }

            //=============================
            // Desenha a cabeça da cobra, com olhos e língua
            // voltados para a direção atual do movimento
            //=============================
            function desenharCabeca(cx, cy){
                let raio = tamanhoQuadrado / 2;

                let dirX = 0, dirY = 0;
                switch(direcao){
                    case 'direita':  dirX = 1;  dirY = 0;  break;
                    case 'esquerda': dirX = -1; dirY = 0;  break;
                    case 'cima':     dirX = 0;  dirY = -1; break;
                    case 'baixo':    dirX = 0;  dirY = 1;  break;
                }

                //corpo da cabeça
                let gradiente = ctx.createRadialGradient(cx - 3, cy - 3, 1, cx, cy, raio + 1);
                gradiente.addColorStop(0, '#6FCB63');
                gradiente.addColorStop(1, '#2d5016');
                ctx.fillStyle = gradiente;
                ctx.beginPath();
                ctx.arc(cx, cy, raio, 0, Math.PI * 2);
                ctx.fill();

                //língua (só aparece na frente da cabeça)
                ctx.strokeStyle = '#c0392b';
                ctx.lineWidth = 1.5;
                let pontaX = cx + dirX * (raio + 6);
                let pontaY = cy + dirY * (raio + 6);
                let baseX = cx + dirX * raio;
                let baseY = cy + dirY * raio;
                ctx.beginPath();
                ctx.moveTo(baseX, baseY);
                ctx.lineTo(pontaX, pontaY);
                ctx.stroke();
                //garfo da língua
                let perpX = -dirY, perpY = dirX;
                ctx.beginPath();
                ctx.moveTo(pontaX, pontaY);
                ctx.lineTo(pontaX + dirX * 2 + perpX * 2, pontaY + dirY * 2 + perpY * 2);
                ctx.moveTo(pontaX, pontaY);
                ctx.lineTo(pontaX + dirX * 2 - perpX * 2, pontaY + dirY * 2 - perpY * 2);
                ctx.stroke();

                //olhos (posicionados perpendicularmente à direção do movimento)
                let olho1X = cx + dirX * 2 + perpX * 4;
                let olho1Y = cy + dirY * 2 + perpY * 4;
                let olho2X = cx + dirX * 2 - perpX * 4;
                let olho2Y = cy + dirY * 2 - perpY * 4;

                [[olho1X, olho1Y], [olho2X, olho2Y]].forEach(([ox, oy]) => {
                    ctx.fillStyle = '#ffffff';
                    ctx.beginPath();
                    ctx.arc(ox, oy, 2.3, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = '#111111';
                    ctx.beginPath();
                    ctx.arc(ox + dirX * 0.8, oy + dirY * 0.8, 1.1, 0, Math.PI * 2);
                    ctx.fill();
                });
            }

            //=============================
            // Desenha a comida como uma maçã (corpo, cabinho e folha)
            //=============================
            function desenharMaca(){
                let cx = comida.x * tamanhoQuadrado + tamanhoQuadrado / 2;
                let cy = comida.y * tamanhoQuadrado + tamanhoQuadrado / 2;
                let raio = tamanhoQuadrado / 2 - 3;

                //corpo da maçã (dois lóbulos + gradiente para dar volume)
                let gradiente = ctx.createRadialGradient(cx - 3, cy - 4, 1, cx, cy, raio + 2);
                gradiente.addColorStop(0, '#FF6B6B');
                gradiente.addColorStop(0.55, '#E63946');
                gradiente.addColorStop(1, '#A81C2C');
                ctx.fillStyle = gradiente;

                ctx.beginPath();
                ctx.arc(cx - raio * 0.55, cy + 1, raio * 0.75, 0, Math.PI * 2);
                ctx.arc(cx + raio * 0.55, cy + 1, raio * 0.75, 0, Math.PI * 2);
                ctx.arc(cx, cy + 2, raio, 0, Math.PI * 2);
                ctx.fill();

                //reentrância no topo da maçã
                ctx.fillStyle = '#F0F0F0';
                ctx.beginPath();
                ctx.ellipse(cx, cy - raio, 2, 1.5, 0, 0, Math.PI * 2);
                ctx.fill();

                //cabinho
                ctx.strokeStyle = '#6B4226';
                ctx.lineWidth = 1.8;
                ctx.beginPath();
                ctx.moveTo(cx, cy - raio + 1);
                ctx.lineTo(cx + 1.5, cy - raio - 4);
                ctx.stroke();

                //folha
                ctx.fillStyle = '#4CAF50';
                ctx.beginPath();
                ctx.ellipse(cx + 4, cy - raio - 3, 3.5, 1.8, Math.PI / 3, 0, Math.PI * 2);
                ctx.fill();

                //brilho (dá volume/realismo)
                ctx.fillStyle = 'rgba(255, 255, 255, 0.55)';
                ctx.beginPath();
                ctx.ellipse(cx - raio / 2.5, cy - raio / 3, raio / 4, raio / 6, -Math.PI / 5, 0, Math.PI * 2);
                ctx.fill();
            }

            //=============================
            //====FUNÇÃO PARA GERAR COMIDA
            //=============================
            function gerarComida(){
                let posicaoValida = false;

                while(!posicaoValida){
                    //gera uma posição aleatória para a comida
                    comida = {
                        x : Math.floor(Math.random() * quantidadeQuadrados),
                        y : Math.floor(Math.random() * quantidadeQuadrados)
                    }

                    //verificar se a comida não está em cima da cobra
                    posicaoValida = true;
                    
                    for(let pedaco of cobra){
                        if(comida.x === pedaco.x && comida.y === pedaco.y ){
                            posicaoValida = false;
                            break;
                        }
                    }
                }
            }

            function mudarDirecao(novaDirecao){
              
                if(novaDirecao === 'cima'    &&  direcao !== 'baixo'){
                    proximaDirecao = 'cima';
                }

                if(novaDirecao === 'baixo'    &&  direcao !== 'cima'){
                    proximaDirecao = 'baixo';
                }

                if(novaDirecao === 'esquerda'    &&  direcao !== 'direita'){
                    proximaDirecao = 'esquerda';
                }

                if(novaDirecao === 'direita'    &&  direcao !== 'esquerda'){
                    proximaDirecao = 'direita';
                }
            }
            
            function pausarJogo(){
                pausarJogo = !pausarJogo;

                if(pausarJogo === true){
                    clearInterval(intervaloJogo);
                }else{
                    intervaloJogo = setInterval(atualizarJogo, 200);
                }

            }

            //================================//
            //---CONTRTOLE DE TECLADO---------//
            //================================//
              document.addEventListener('keydown', function(event){
                if(event.key === 'ArrowDown'){
                    mudarDirecao('baixo');
                }else if(event.key === 'ArrowUp'){
                    mudarDirecao('cima');
                }else if(event.key === 'ArrowLeft'){
                    mudarDirecao('esquerda');
                }else if(event.key === 'ArrowRight'){
                    mudarDirecao('direita');
                }
              })
                

        

              

            

        </script>

    </body>
</html>
