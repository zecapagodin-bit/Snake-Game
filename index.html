<!DOCTYPE html>

<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <!--
             <meta charset> Define o conjunto de caracteres (enconding) 
             da página. UTF-8 garante que acentos e caracteres especiais
             apareçam corretamente.
        -->
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        
        <!--
        <meta viewport>:  esta tag é imortante para sites que devem funcionar
        em dispositivos móveis (celular). width-device -> garate que a
        largura da página vai ser adaptar à largura do dispositivo.
        initial-scale=1 -> não aplica zoom automático ao abrir a página. 
        Sem ela o celular vai tentar mostrar a página como se fosse um computador
        -->
        <title>Jogo do Urso</title>

        <!--
        Estilos e CSS - tema de toca de urso na floresta
        -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">

        <style>

            :root {
                --caverna-escura: #241611;
                --caverna: #3B2417;
                --pedra: #6E5849;
                --pedra-clara: #A88B72;
                --tronco: #6B4423;
                --tronco-claro: #8B5A2B;
                --floresta-escura: #1F3320;
                --floresta: #3B5D3A;
                --clareira: #F3E7CC;
                --mel: #E8960A;
                --mel-claro: #FFC94D;
                --texto-claro: #FBEFD9;
            }

            * {
                box-sizing: border-box;
            }

            body {
                margin: 0;
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 30px 16px;
                font-family: 'Quicksand', sans-serif;
                background:
                    radial-gradient(circle at 20% 15%, rgba(255, 201, 77, 0.2), transparent 45%),
                    linear-gradient(180deg, #1A120B 0%, #241611 35%, #2B1B0E 100%);
                position: relative;
                overflow-x: hidden;
            }

            /* silhuetas de montanhas e pinheiros ao fundo, feitas só em CSS,
               lembrando uma toca de urso na floresta */
            body::before,
            body::after {
                content: "";
                position: fixed;
                bottom: 0;
                width: 100%;
                height: 220px;
                background-repeat: repeat-x;
                background-position: bottom;
                pointer-events: none;
                opacity: 0.55;
                z-index: 0;
            }

            body::before {
                background-image:
                    radial-gradient(ellipse 90px 150px at 10% 100%, #14100C 55%, transparent 58%),
                    radial-gradient(ellipse 110px 180px at 30% 100%, #14100C 55%, transparent 58%),
                    radial-gradient(ellipse 90px 140px at 55% 100%, #14100C 55%, transparent 58%),
                    radial-gradient(ellipse 110px 190px at 80% 100%, #14100C 55%, transparent 58%),
                    radial-gradient(ellipse 90px 150px at 100% 100%, #14100C 55%, transparent 58%);
            }

            body::after {
                height: 150px;
                opacity: 0.8;
                background-image:
                    radial-gradient(ellipse 60px 110px at 0% 100%, #24170F 60%, transparent 62%),
                    radial-gradient(ellipse 80px 130px at 22% 100%, #24170F 60%, transparent 62%),
                    radial-gradient(ellipse 60px 100px at 45% 100%, #24170F 60%, transparent 62%),
                    radial-gradient(ellipse 90px 140px at 68% 100%, #24170F 60%, transparent 62%),
                    radial-gradient(ellipse 70px 120px at 90% 100%, #24170F 60%, transparent 62%);
            }

            h1 {
                font-family: 'Baloo 2', sans-serif;
                font-weight: 800;
                color: var(--texto-claro);
                font-size: 2.2em;
                margin: 0 0 18px 0;
                text-shadow: 0 3px 0 rgba(0,0,0,0.35);
            }

            .container {
              position: relative;
              z-index: 1;
              text-align: center;  
              background: linear-gradient(180deg, #EFE1C4 0%, #E3D0A6 100%);
              padding: 28px 30px 22px;
              border-radius: 26px;
              border: 6px solid var(--tronco-claro);
              box-shadow:
                0 18px 40px rgba(0, 0, 0, 0.5),
                inset 0 0 0 3px rgba(107, 68, 35, 0.25);
              max-width: 460px;
            }

            /* patinhas de urso nos cantos do painel, no lugar das folhas */
            .container::before,
            .container::after {
                content: "🐾";
                position: absolute;
                font-size: 28px;
                filter: drop-shadow(0 2px 2px rgba(0,0,0,0.25));
            }
            .container::before {
                top: -16px;
                left: -14px;
                transform: rotate(-25deg);
            }
            .container::after {
                bottom: -16px;
                right: -14px;
                transform: rotate(155deg);
            }

            .info {
                font-size: 1.05em;
                display: flex;
                justify-content: center;
                gap: 24px;
                flex-wrap: wrap;
                font-weight: 600;
            }

            .pontuacao {
                color: var(--floresta);
            }

            .pontuacao span, .recorde span {
                font-family: 'Baloo 2', sans-serif;
                color: var(--mel);
                -webkit-text-stroke: 0.6px #7a4d00;
            }

            .recorde {
                color: var(--tronco);
            }

            #canvas{
                border: 4px solid var(--tronco-claro);
                border-radius:  14px;
                background-color: #EFE3C8;
                display: block;
                max-width: 100%;
                height: auto;

                margin: 18px auto;
                box-shadow:
                    inset 0 0 0 2px rgba(255,255,255,0.5),
                    0 8px 18px rgba(36, 22, 17, 0.4);
            }

            .controles {
                margin-top: 8px;
            }

            button {
                font-family: 'Baloo 2', sans-serif;
                font-size: 16px;
                font-weight: 700;
                cursor: pointer;
                background: linear-gradient(180deg, var(--mel-claro) 0%, var(--mel) 100%);

                padding: 12px 24px;
                color: #4A2E00;
                border: none;
                border-bottom: 4px solid #A85E00;
                border-radius: 12px;
                margin: 5px;
                transition: transform 0.15s ease, filter 0.15s ease;
            }

            button:hover {
                filter: brightness(1.08);
                transform: translateY(-1px);
            }

            button:active {
                transform: translateY(2px);
                border-bottom-width: 2px;
            }

            .teclas{
                display: grid;
                grid-template-columns: repeat(3, 52px);
                gap: 6px;
                justify-content: center;
                margin: 16px auto 4px;
            }

            .tecla{
                width: 52px;
                height: 52px;
                background: linear-gradient(180deg, var(--tronco-claro) 0%, var(--tronco) 100%);
                color: var(--clareira);
                border: none;
                border-bottom: 4px solid #40260f;
                cursor: pointer;
                border-radius: 14px;
                font-size: 20px;
                display: flex;
                align-items: center;
                justify-content: center;
                font-weight: bold;
                transition: transform 0.15s ease;
            }

            .tecla:active{
                background: #40260f;
                transform: translateY(2px);
                border-bottom-width: 2px;
            }

            .tecla.vazio{
                background: transparent;
                border: none;
                cursor: default;
            }

            .instrucoes {
                margin-top: 18px;
                padding: 14px 16px;
                background: rgba(232, 150, 10, 0.15);
                border: 2px dashed var(--mel);
                border-radius: 14px;
                font-size: 14px;
                color: #6E4B00;
                text-align: left;
            }

            .instrucoes h3 {
                margin: 0 0 8px 0;
                color: var(--caverna);
                font-family: 'Baloo 2', sans-serif;
            }

            .instrucoes p {
                margin: 4px 0;
            }

            /*   
            MEDIA QUERY - adaptação para celular
            É como definir renders diferentes para exibição em cinena (4K) vs 
            Celular na vertical
            */
            @media (max-width: 600px){
                h1 {
                    font-size: 1.6em;
                }
                .info {
                    font-size: 0.95em;
                    gap: 14px;
                }
                .container {
                    padding: 22px 16px 18px;
                }
            }

        </style>
    </head>
    <body>

        <div  class="container">
            <h1>&#128058;  Jogo do Urso &#127855;</h1>

            <div class="info">

                <div class="pontuacao">
                    Pontuação: <span id="pontos"> </span>
                </div>

                <div class="recorde">
                    Recorde: <span id="recorde"> </span>
                </div>

            </div>
            <canvas id="canvas" width="400" height="400">
                <!--
                
                <canvas>: é um elemento especial para desenho 2D ou 3D. Por si só,
                é apenas um retângulo vazio. O JavaScript vai usar o "contexto 2D" 
                para desenhar o urso, a comida, etc
                -->

            </canvas>

            <div  class="controles">
                
                <button onclick="iniciarJogo()">Iniciar Jogo</button>
                <button onclick="pausarJogo()">Pausar / Continuar</button>

            </div>

            <div class="teclas">

                <div class="tecla vazio"></div>
                <div class="tecla" onclick="mudarDirecao('cima')" >&#9650;</div>
                <div class="tecla vazio"></div>
                <div class="tecla" onclick="mudarDirecao('esquerda')" >&#9668;</div>
                <div class="tecla" onclick="mudarDirecao('baixo')" >&#9660;</div>
                <div class="tecla" onclick="mudarDirecao('direita')" >&#9658;</div>

            </div>

            <div class="instrucoes">
                <h3>Como Jogar:</h3>
                <p>Use as setas de teclado ou os botões acima para controlar o urso</p>
                <p>Coma os favos de mel &#127855; para crescer e ganhar pontos</p>
                <p>Não bata nas paredes nem no próprio corpo</p>
            </div>

        </div>

        <script>

            //=============================
            // CONFIGURAÇÕES DO JOGO
            //=============================
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');
            // tamanho de cada quadrado no jogo
            const tamanhoQuadrado = 20;
            // quantos quadrados cabem na largura e altura do espaço 2D
            const quantidadeQuadrados = canvas.width / tamanhoQuadrado;

            //============================
            // Variáveis do Jogo
            //============================
            let cobra;              // Array (vetor) que guarda as posições da cobra (corpo do urso)
            let direcao;            // Direção atual da cobra
            let proximaDirecao;     // Próxima direção (evita viradas impossíveis)
            let comida;             // Posição da comida
            let pontos;             // Pontuação atual
            let recorde;            // Melhor pontuação
            let jogoAtivo;          // Se o jogo está rodando
            let jogoPausado;        // Se o jogo está pausado
            let intervaloJogo;      // Controla a velocidade do jogo

            //==============================
            // Carregar recorde do Navegador
            //==============================
            recorde = localStorage.getItem('recordeCobrinha') || 0;
            document.getElementById('recorde').textContent = recorde;

            //==============================
            // Função para inicar o Jogo
            //==============================
            function iniciarJogo(){
                cobra = [
                    { x: 10, y: 10},
                    { x: 9,  y: 10},
                    { x: 8,  y: 10},
                ];

                direcao = 'direita';
                proximaDirecao = 'direita';
                pontos = 0;
                jogoAtivo = true;
                jogoPausado = false;

                document.getElementById('pontos').textContent = pontos;

                gerarComida();

                //Limpar o intervalo anterior se existir
                if(intervaloJogo){
                    clearInterval(intervaloJogo);
                }

                //executa a função atualizarJogo a cada 100 milisegundos
                intervaloJogo = setInterval(atualizarJogo, 180);
            }


            //===================================
            // FUNÇÃO PRINCIPAL DO JOGO ( LOOP )
            //===================================
            function atualizarJogo(){
               if(!jogoAtivo || jogoPausado){
                    return;
               }

               direcao = proximaDirecao;
                
               let cabeca = {...cobra[0]} 

               //Mover a cabeça na direção atual
               switch(direcao){
                    case 'cima':
                        cabeca.y--;
                        break;
                    
                    case 'baixo':
                        cabeca.y++;
                        break;

                    case 'esquerda':
                        cabeca.x--;
                        break;

                    case 'direita':
                        cabeca.x++;
                        break;
               }

                // verificar colisão com paredes (esquerda ou direita)
                if(cabeca.x < 0 || cabeca.x >= quantidadeQuadrados){
                   fimDeJogo();
                   return;
               }

                if(cabeca.y < 0 || cabeca.y >= quantidadeQuadrados){
                   fimDeJogo();
                   return;
               }

               // adiciona nova cabeça
               cobra.unshift(cabeca);

               if(cabeca.x === comida.x && cabeca.y === comida.y){

                pontos = pontos +1;

               }else{
                cobra.pop();
               }

               
               desenhar();                
            }


            function atualizarPainelPontos(){
                document.getElementById('pontos').textContent = pontos;
                atualizarRecordePontuacao;

            }

            function atualizarRecordePontuacao(){
                if(pontos > recorde){
                    document.getElementById('recorde').textContent = pontos;
                    localStorage.setItem('recordeCobrinha', pontos);
                }
            }





               //FIM DE JOGO

               function fimDeJogo(){
                jogoAtivo = false;
                clearInterval(intervaloJogo);


                ctx.fillStyle = 'rgba(36, 22, 17, 0.8)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = '#FFC94D';
                ctx.font = 'bold 40px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('PERDEU FIOTE', canvas.width / 2, canvas.height / 2)

                ctx.fillStyle = '#FBEFD9';
                ctx.font = '20px Arial';
                ctx.fillText(`pontuação: ${pontos}`, canvas.width / 2, (canvas.height / 2 + 50));

               }

            //=============================
            //FUNÇÃO PARA DESENHAR OS ELEMENTOS VISUAIS DO JOGO
            //=============================
            function desenhar(){
                // PASSO 1
                //Limpar o fundo do Canvas (tom de terra clara da toca)
                ctx.fillStyle = '#EFE3C8';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // PASSO 2
                // Desenhar a grade (linhas de referência)
                ctx.strokeStyle = '#D8C6A0';
                ctx.lineWidth = 0.5;

                for(let i = 0; i <= quantidadeQuadrados; i++){
                        //Linha vertical
                        ctx.beginPath();
                        ctx.moveTo(i * tamanhoQuadrado, 0);
                        ctx.lineTo(i * tamanhoQuadrado, canvas.height);
                        ctx.stroke();

                        //Linha horizontal
                        ctx.beginPath();
                        ctx.moveTo(0, i * tamanhoQuadrado);
                        ctx.lineTo(canvas.width, i * tamanhoQuadrado);
                        ctx.stroke();
                } 

                // ----- PASSO 3: Desenhar o urso ---------------------
                // percorremos do rabo para a cabeça para o pelo
                // ficar sobreposto de forma natural
                for(let indice = cobra.length - 1; indice >= 0; indice--){
                    let pedaco = cobra[indice];
                    let cx = pedaco.x * tamanhoQuadrado + tamanhoQuadrado / 2;
                    let cy = pedaco.y * tamanhoQuadrado + tamanhoQuadrado / 2;

                    if(indice === 0){
                        desenharCabeca(cx, cy);
                    } else {
                        desenharCorpo(pedaco, cx, cy, indice);
                    }
                }

               //----  PASSO 4 - Desenhar a comida (favo de mel) ----------
               desenharMel();
            }

            //=============================
            // Desenha um retângulo com cantos arredondados
            // (evita depender do ctx.roundRect nativo)
            //=============================
            function retanguloArredondado(x, y, largura, altura, raio){
                ctx.beginPath();
                ctx.moveTo(x + raio, y);
                ctx.arcTo(x + largura, y, x + largura, y + altura, raio);
                ctx.arcTo(x + largura, y + altura, x, y + altura, raio);
                ctx.arcTo(x, y + altura, x, y, raio);
                ctx.arcTo(x, y, x + largura, y, raio);
                ctx.closePath();
            }

            //=============================
            // Desenha um segmento do corpo do urso, com sombreado
            // e um leve traço de pelagem para dar textura
            //=============================
            function desenharCorpo(pedaco, cx, cy, indice){
                let x = pedaco.x * tamanhoQuadrado + 1;
                let y = pedaco.y * tamanhoQuadrado + 1;
                let tamanho = tamanhoQuadrado - 2;

                let corClara = (indice % 2 === 0) ? '#8B5A2B' : '#6B4423';
                let corEscura = (indice % 2 === 0) ? '#5C3A1E' : '#42280F';

                let gradiente = ctx.createRadialGradient(cx - 3, cy - 3, 1, cx, cy, tamanhoQuadrado / 2);
                gradiente.addColorStop(0, corClara);
                gradiente.addColorStop(1, corEscura);

                ctx.fillStyle = gradiente;
                retanguloArredondado(x, y, tamanho, tamanho, 8);
                ctx.fill();

                //pelagem (pequenos traços escuros para dar textura de pelo)
                ctx.strokeStyle = 'rgba(0, 0, 0, 0.18)';
                ctx.lineWidth = 1;
                for(let t = -1; t <= 1; t++){
                    ctx.beginPath();
                    ctx.moveTo(cx - 4, cy + t * 3);
                    ctx.lineTo(cx + 4, cy + t * 3 - 1);
                    ctx.stroke();
                }
            }

            //=============================
            // Desenha a cabeça do urso, com orelhas, focinho, nariz
            // e olhos voltados para a direção atual do movimento
            //=============================
            function desenharCabeca(cx, cy){
                let raio = tamanhoQuadrado / 2;

                let dirX = 0, dirY = 0;
                switch(direcao){
                    case 'direita':  dirX = 1;  dirY = 0;  break;
                    case 'esquerda': dirX = -1; dirY = 0;  break;
                    case 'cima':     dirX = 0;  dirY = -1; break;
                    case 'baixo':    dirX = 0;  dirY = 1;  break;
                }

                let perpX = -dirY, perpY = dirX;

                //orelhas (dois círculos atrás da cabeça)
                ctx.fillStyle = '#5C3A1E';
                ctx.beginPath();
                ctx.arc(cx - dirX * raio * 0.3 + perpX * raio * 0.75, cy - dirY * raio * 0.3 + perpY * raio * 0.75, raio * 0.35, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(cx - dirX * raio * 0.3 - perpX * raio * 0.75, cy - dirY * raio * 0.3 - perpY * raio * 0.75, raio * 0.35, 0, Math.PI * 2);
                ctx.fill();

                //cabeça (corpo principal)
                let gradiente = ctx.createRadialGradient(cx - 3, cy - 3, 1, cx, cy, raio + 1);
                gradiente.addColorStop(0, '#8B5A2B');
                gradiente.addColorStop(1, '#42280F');
                ctx.fillStyle = gradiente;
                ctx.beginPath();
                ctx.arc(cx, cy, raio, 0, Math.PI * 2);
                ctx.fill();

                //focinho (parte clara virada para a direção do movimento)
                let focinhoX = cx + dirX * raio * 0.7;
                let focinhoY = cy + dirY * raio * 0.7;
                ctx.fillStyle = '#D9B48C';
                ctx.beginPath();
                ctx.ellipse(focinhoX, focinhoY, raio * 0.55, raio * 0.42, Math.atan2(dirY, dirX), 0, Math.PI * 2);
                ctx.fill();

                //nariz (na ponta do focinho)
                let narizX = cx + dirX * (raio + 2);
                let narizY = cy + dirY * (raio + 2);
                ctx.fillStyle = '#1A1A1A';
                ctx.beginPath();
                ctx.ellipse(narizX, narizY, 2.4, 1.7, Math.atan2(dirY, dirX), 0, Math.PI * 2);
                ctx.fill();

                //olhos (posicionados perpendicularmente à direção do movimento)
                let olho1X = cx + dirX * 1 + perpX * 4;
                let olho1Y = cy + dirY * 1 + perpY * 4;
                let olho2X = cx + dirX * 1 - perpX * 4;
                let olho2Y = cy + dirY * 1 - perpY * 4;

                [[olho1X, olho1Y], [olho2X, olho2Y]].forEach(([ox, oy]) => {
                    ctx.fillStyle = '#ffffff';
                    ctx.beginPath();
                    ctx.arc(ox, oy, 2, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = '#111111';
                    ctx.beginPath();
                    ctx.arc(ox + dirX * 0.6, oy + dirY * 0.6, 1, 0, Math.PI * 2);
                    ctx.fill();
                });
            }

            //=============================
            // Desenha a comida como um favo de mel hexagonal,
            // com textura de favo e uma gotinha escorrendo
            //=============================
            function desenharMel(){
                let cx = comida.x * tamanhoQuadrado + tamanhoQuadrado / 2;
                let cy = comida.y * tamanhoQuadrado + tamanhoQuadrado / 2;
                let raio = tamanhoQuadrado / 2 - 2;

                //hexágono do favo, com gradiente dourado para dar volume
                let gradiente = ctx.createRadialGradient(cx - 2, cy - 2, 1, cx, cy, raio + 2);
                gradiente.addColorStop(0, '#FFD166');
                gradiente.addColorStop(0.6, '#F4A300');
                gradiente.addColorStop(1, '#C97B00');
                ctx.fillStyle = gradiente;

                ctx.beginPath();
                for(let i = 0; i < 6; i++){
                    let angulo = Math.PI / 3 * i - Math.PI / 2;
                    let px = cx + raio * Math.cos(angulo);
                    let py = cy + raio * Math.sin(angulo);
                    if(i === 0){ ctx.moveTo(px, py); } else { ctx.lineTo(px, py); }
                }
                ctx.closePath();
                ctx.fill();

                ctx.strokeStyle = '#A85E00';
                ctx.lineWidth = 1;
                ctx.stroke();

                //hexágono interno (textura do favo)
                ctx.strokeStyle = 'rgba(168, 94, 0, 0.5)';
                ctx.lineWidth = 0.6;
                let raioInterno = raio * 0.5;
                ctx.beginPath();
                for(let i = 0; i < 6; i++){
                    let angulo = Math.PI / 3 * i - Math.PI / 2;
                    let px = cx + raioInterno * Math.cos(angulo);
                    let py = cy + raioInterno * Math.sin(angulo);
                    if(i === 0){ ctx.moveTo(px, py); } else { ctx.lineTo(px, py); }
                }
                ctx.closePath();
                ctx.stroke();

                //gotinha de mel escorrendo
                ctx.fillStyle = '#F4A300';
                ctx.beginPath();
                ctx.moveTo(cx + raio * 0.3, cy + raio * 0.7);
                ctx.quadraticCurveTo(cx + raio * 0.5, cy + raio * 1.3, cx + raio * 0.3, cy + raio * 1.6);
                ctx.quadraticCurveTo(cx + raio * 0.1, cy + raio * 1.3, cx + raio * 0.3, cy + raio * 0.7);
                ctx.fill();

                //brilho (dá volume/realismo)
                ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
                ctx.beginPath();
                ctx.ellipse(cx - raio / 3, cy - raio / 3, raio / 5, raio / 8, -Math.PI / 5, 0, Math.PI * 2);
                ctx.fill();
            }

            //=============================
            //====FUNÇÃO PARA GERAR COMIDA
            //=============================
            function gerarComida(){
                let posicaoValida = false;

                while(!posicaoValida){
                    //gera uma posição aleatória para a comida
                    comida = {
                        x : Math.floor(Math.random() * quantidadeQuadrados),
                        y : Math.floor(Math.random() * quantidadeQuadrados)
                    }

                    //verificar se a comida não está em cima da cobra
                    posicaoValida = true;
                    
                    for(let pedaco of cobra){
                        if(comida.x === pedaco.x && comida.y === pedaco.y ){
                            posicaoValida = false;
                            break;
                        }
                    }
                }
            }

            function mudarDirecao(novaDirecao){
              
                if(novaDirecao === 'cima'    &&  direcao !== 'baixo'){
                    proximaDirecao = 'cima';
                }

                if(novaDirecao === 'baixo'    &&  direcao !== 'cima'){
                    proximaDirecao = 'baixo';
                }

                if(novaDirecao === 'esquerda'    &&  direcao !== 'direita'){
                    proximaDirecao = 'esquerda';
                }

                if(novaDirecao === 'direita'    &&  direcao !== 'esquerda'){
                    proximaDirecao = 'direita';
                }
            }
            
            function pausarJogo(){
                if(!jogoAtivo){
                    return;
                }

                jogoPausado = !jogoPausado;

                if(jogoPausado === true){
                    clearInterval(jogoPausado);
                  


                ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillstyle = 'white';
                ctx.font = '30px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('PAUSADO!', canvas.width/2, canvas.height/2);

                }else{
                    intervaloJogo = setInterval(atualizarJogo, 300);
                }

            }

            //================================//
            //---CONTRTOLE DE TECLADO---------//
            //================================//
               document.addEventListener('keydown', function(event){
              if(event.key === 'ArrowDown'){
                 event.preventDefault();
                 mudarDirecao('baixo');
              }else if(event.key === 'ArrowUp'){
                event.preventDefault();
                mudarDirecao('cima');
              }else if(event.key === 'ArrowLeft'){
                event.preventDefault();
                mudarDirecao('esquerda');
              }else if(event.key === 'ArrowRight'){
                event.preventDefault();
                mudarDirecao('direita');
              }else if(event.key === ' '){
                event.preventDefault();
                pausarJogo();
              }
                })
                

        

              

            

        </script>

    </body>
</html>
