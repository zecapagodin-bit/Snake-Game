<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Toca de Jogos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --caverna:#3B2417; --tronco:#6B4423; --tronco-claro:#8B5A2B;
  --mel:#E8960A; --mel-claro:#FFC94D; --creme:#EFE1C4; --texto-claro:#FBEFD9;
}
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; font-family:'Quicksand',sans-serif; color:var(--texto-claro);
  background:radial-gradient(circle at 20% 10%, rgba(255,201,77,.18), transparent 45%),
             linear-gradient(180deg,#1A120B 0%,#241611 40%,#2B1B0E 100%);
}
header{text-align:center; padding:48px 16px 24px}
h1{font-family:'Baloo 2',sans-serif; font-weight:800; font-size:2.8em; margin:0; text-shadow:0 3px 0 rgba(0,0,0,.35)}
header p{margin:6px 0 0; font-size:1.1em; opacity:.85}

main{max-width:900px; margin:0 auto; padding:16px 16px 60px}
.grade{display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:22px}

.card{
  display:flex; flex-direction:column; text-decoration:none; color:var(--caverna);
  background:linear-gradient(180deg,#EFE1C4 0%,#E3D0A6 100%);
  border:5px solid var(--tronco-claro); border-radius:22px; overflow:hidden;
  box-shadow:0 14px 30px rgba(0,0,0,.45), inset 0 0 0 3px rgba(107,68,35,.2);
  transition:transform .18s ease, box-shadow .18s ease;
}
a.card:hover, a.card:focus-visible{transform:translateY(-6px) rotate(-.6deg); box-shadow:0 20px 36px rgba(0,0,0,.55); outline:none}
a.card:focus-visible{outline:3px solid var(--mel-claro); outline-offset:3px}
.capa{
  display:flex; align-items:center; justify-content:center; height:120px; font-size:64px;
  background:linear-gradient(135deg,#6B4423,#3B2417);
}
.corpo{padding:14px 16px 16px; display:flex; flex-direction:column; gap:8px; flex:1}
.corpo h2{margin:0; font-family:'Baloo 2',sans-serif; font-size:1.35em}
.corpo p{margin:0; font-size:.95em; color:#5a3d22; flex:1}
.tags{display:flex; gap:6px; flex-wrap:wrap}
.tag{font-size:.78em; font-weight:700; padding:2px 10px; border-radius:20px; background:rgba(107,68,35,.15); color:var(--tronco)}
.rodape{display:flex; justify-content:space-between; align-items:center; margin-top:4px}
.recorde{font-weight:700; font-size:.9em; color:#7a4d00}
.jogar{
  font-family:'Baloo 2',sans-serif; font-weight:700; padding:6px 16px; border-radius:12px;
  background:linear-gradient(180deg,var(--mel-claro),var(--mel)); border-bottom:3px solid #A85E00; color:#4A2E00;
}
.card.breve{opacity:.6; filter:grayscale(.5); cursor:default}
.card.breve .capa{background:linear-gradient(135deg,#5b4a3d,#352a22)}
.selo{font-family:'Baloo 2',sans-serif; font-weight:700; color:var(--tronco)}

footer{text-align:center; padding:20px; font-size:.9em; opacity:.6}
@media (max-width:600px){ h1{font-size:2em} header{padding-top:32px} }
</style>
</head>
<body>
<header>
  <h1>🐾 Toca de Jogos 🍯</h1>
  <p>Escolha um jogo e divirta-se!</p>
</header>

<main>
  <div class="grade" id="grade"></div>
</main>

<footer>Feito com HTML, CSS e JavaScript</footer>

<script>
//=============================
// CARDÁPIO: para adicionar um jogo, copie um bloco e edite
//=============================
const JOGOS = [
  {
    titulo: 'Jogo do Urso',
    descricao: 'Ajude o urso a comer favos de mel sem bater nas paredes. Três dificuldades, níveis e combos.',
    emoji: '🐻',
    url: 'jogos/index.html',
    tags: ['Arcade', 'Clássico'],
    chavesRecorde: ['urso_recorde_facil', 'urso_recorde_normal', 'urso_recorde_dificil']
  },
  { titulo: 'Jogo da Memória', descricao: 'Encontre os pares de cartas.', emoji: '🧠', emBreve: true },
  { titulo: 'Pedra, Papel e Tesoura', descricao: 'Desafie o computador.', emoji: '✊', emBreve: true }
];

// pega o maior recorde salvo (o jogo salva um por dificuldade)
function melhorRecorde(chaves = []){
  try{
    const valores = chaves.map(c => Number(localStorage.getItem(c)) || 0);
    return Math.max(0, ...valores);
  }catch(e){ return 0; }
}

function criarCard(jogo){
  const el = document.createElement(jogo.emBreve ? 'div' : 'a');
  el.className = 'card' + (jogo.emBreve ? ' breve' : '');
  if(!jogo.emBreve) el.href = jogo.url;

  const rec = melhorRecorde(jogo.chavesRecorde);
  const tags = (jogo.tags || []).map(t => `<span class="tag">${t}</span>`).join('');
  const rodape = jogo.emBreve
    ? `<span class="selo">Em breve</span>`
    : `<span class="recorde">${rec > 0 ? 'Recorde: ' + rec : 'Novo por aqui?'}</span><span class="jogar">Jogar</span>`;

  el.innerHTML = `
    <div class="capa" aria-hidden="true">${jogo.emoji}</div>
    <div class="corpo">
      <h2>${jogo.titulo}</h2>
      <p>${jogo.descricao}</p>
      <div class="tags">${tags}</div>
      <div class="rodape">${rodape}</div>
    </div>`;
  return el;
}

const grade = document.getElementById('grade');
JOGOS.forEach(j => grade.appendChild(criarCard(j)));
</script>
</body>
</html>
